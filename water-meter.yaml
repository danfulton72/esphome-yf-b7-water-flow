substitutions:
  device_name: water-meter
  friendly_name: "Water Meter"

  # YF-B7 flow calibration.
  # SmartHomeShop starting point: ~660 pulses/L = 1/660 L per pulse.
  # Change this one value after calibration; it is used for both
  # instantaneous flow and the cumulative water total.
  flow_multiplier: "0.00151515"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "PUT_YOUR_API_ENCRYPTION_KEY_HERE"

ota:
  - platform: esphome
    password: "PUT_YOUR_OTA_PASSWORD_HERE"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Water Meter Fallback"
    password: "change-me-1234"

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time

sensor:
  # YF-B7 flow sensor: approximately 660 pulses per litre.
  - platform: pulse_counter
    id: water_flow
    name: "Water Flow Rate"
    pin:
      number: GPIO27
      mode:
        input: true
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE
    update_interval: 5s
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    icon: "mdi:water-pump"
    state_class: measurement
    filters:
      - multiply: ${flow_multiplier}
    total:
      id: water_total_l
      name: "Water Total"
      unit_of_measurement: "L"
      accuracy_decimals: 1
      icon: "mdi:water"
      device_class: water
      state_class: total_increasing
      filters:
        - multiply: ${flow_multiplier}

  - platform: template
    name: "Water Total m³"
    id: water_total_m3
    unit_of_measurement: "m³"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3
    icon: "mdi:water"
    update_interval: 10s
    lambda: |-
      return id(water_total_l).state / 1000.0;

  - platform: total_daily_energy
    name: "Water Usage Today"
    id: water_today
    power_id: water_flow
    unit_of_measurement: "L"
    accuracy_decimals: 1
    state_class: total_increasing
    icon: "mdi:water"
    method: left
    restore: true

  # Temperature divider:
  # 3.3V -> 47k resistor -> GPIO34 -> YF-B7 NTC -> GND
  - platform: adc
    pin: GPIO34
    id: water_temp_adc
    attenuation: 12db
    update_interval: 10s
    internal: true

  - platform: resistance
    id: water_temp_resistance
    sensor: water_temp_adc
    configuration: DOWNSTREAM
    resistor: 47kOhm
    reference_voltage: 3.3V
    internal: true

  - platform: ntc
    sensor: water_temp_resistance
    name: "Water Temperature"
    id: water_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:thermometer-water"
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 50kOhm
